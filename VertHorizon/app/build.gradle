plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ejemplo.verthorizon'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ejemplo.verthorizon'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}

// Algunas dependencias transitivas traen kotlin-stdlib-jdk7/jdk8 1.6.21,
// cuyas clases ya están incluidas en kotlin-stdlib 1.8.22.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
